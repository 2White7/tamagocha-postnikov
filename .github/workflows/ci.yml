name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8 bandit

      - name: Lint with flake8
        run: |
          flake8 tamagocha_pkg tests main.py --max-line-length=100 --extend-ignore=E501

      - name: Security scan with bandit
        run: |
          bandit -r tamagocha_pkg main.py

      - name: Run unit tests
        run: |
          PYTHONPATH=. pytest tests/ -v
